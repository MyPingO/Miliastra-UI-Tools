<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#11151b" />
    <meta
      name="description"
      content="Edit Miliastra UI lists, object data, and Structures in GIA, GIL, and JSON files."
    />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>Miliastra UI Tools</title>
  </head>
  <body>
    <header class="app-header">
      <a href="./" class="brand"
        ><span class="brand-mark" aria-hidden="true">M</span
        ><span>Miliastra <strong>UI Tools</strong></span></a
      ><span class="header-divider"></span><span class="app-label">Editor</span>
      <div class="header-actions">
        <button id="new">+ New</button><button id="open">Open files</button
        ><span class="action-divider"></span
        ><button id="undo" class="icon-button" disabled title="Undo (Ctrl+Z)" aria-label="Undo">
          ↶</button
        ><button
          id="redo"
          class="icon-button"
          disabled
          title="Redo (Ctrl+Shift+Z or Ctrl+Y)"
          aria-label="Redo"
        >
          ↷</button
        ><button id="export" class="primary" disabled>Export file ↓</button
        ><button id="help" class="icon-button help" aria-label="Help">?</button>
      </div>
      <input id="file-input" type="file" accept=".gia,.gil,.json" multiple hidden />
    </header>
    <div id="file-tabs" class="file-tabs" role="navigation" aria-label="Open files"></div>
    <main id="welcome" class="welcome">
      <div class="welcome-title">
        <span class="eyebrow">UI · LISTS · STRUCTURES</span>
        <h1>Open a file. Start editing.</h1>
        <p>Edit GIA, GIL, and JSON files locally.</p>
      </div>
      <button id="welcome-open" class="open-card">
        <span class="upload-icon">↥</span
        ><span><strong>Open files</strong><small>Choose files or drop them anywhere</small></span
        ><span class="file-types">GIA · GIL · JSON</span>
      </button>
      <div class="start-heading">
        <h2>Create new</h2>
        <span>Create a component, Structure, or variable</span>
      </div>
      <div id="templates" class="template-grid"></div>
    </main>
    <main id="editor-layout" class="editor-layout" hidden>
      <aside class="sidebar" aria-label="Document objects">
        <div class="sidebar-heading">
          <h2>Contents</h2>
          <span id="record-count"></span>
        </div>
        <input
          id="object-search"
          type="search"
          placeholder="Find an object or variable…"
          aria-label="Find objects"
        />
        <div id="record-filters" class="record-filters"></div>
        <div id="record-list" class="record-list"></div>
        <div class="sidebar-pager">
          <button id="records-prev" class="icon-button" aria-label="Previous objects">←</button
          ><span id="records-page"></span
          ><button id="records-next" class="icon-button" aria-label="Next objects">→</button>
        </div>
      </aside>
      <section id="inspector" class="inspector" aria-label="Editor"></section>
    </main>
    <footer class="statusbar">
      <span class="local-indicator"><i></i> Local files</span
      ><span id="status-message" role="status" aria-live="polite">Ready</span
      ><span id="document-status"></span>
    </footer>
    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
