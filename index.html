<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Fast, local-only editor and builder for Miliastra UI component GIA and variable export files.">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<title>Miliastra UI Tools · Data Editor</title>
<style>
html,body,#app{width:100%;height:100%;margin:0;background:#090d16}
#app{border:0;display:block}
.boot{position:fixed;inset:0;display:grid;place-items:center;color:#93a4bb;font:14px system-ui;background:#090d16}
.boot strong{color:#f4f7fb}
</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>Miliastra UI Tools</strong><br>Loading editor…</div></div>
<iframe id="app" title="Miliastra UI Tools editor"></iframe>
<script>
(async()=>{
  try{
    const opts={cache:'no-store'};
    const version='20260905l';
    const [sourceRes,cssRes,jsRes,statusRes,deckRes]=await Promise.all([
      fetch('https://raw.githubusercontent.com/MyPingO/Miliastra-UI-Tools/14b43989be0c9954d72718a1ff530412e1b34c87/index.html',opts),
      fetch(`./assets/site.css?v=${version}`,opts),
      fetch(`./assets/site.js?v=${version}`,opts),
      fetch(`./assets/status-display.js?v=${version}`,opts),
      fetch(`./assets/deck-selector.js?v=${version}`,opts)
    ]);
    if(!sourceRes.ok||!cssRes.ok||!jsRes.ok||!statusRes.ok||!deckRes.ok)throw new Error('Failed to load editor assets');

    let source=await sourceRes.text();
    const css=await cssRes.text();
    let js=await jsRes.text();
    let status=await statusRes.text();
    const deck=await deckRes.text();

    js=js
      .replace(/const density=document\.createElement\('button'\);[\s\S]*?syncDensity\(\);const shortcuts=/,'const shortcuts=')
      .replace("if(exportButton){exportButton.insertAdjacentElement('afterend',shortcuts);shortcuts.insertAdjacentElement('afterend',density)}else topbar.append(shortcuts,density);","if(exportButton){exportButton.insertAdjacentElement('afterend',shortcuts)}else topbar.append(shortcuts);");
    source=source.replace(/(VARIABLE_NAME_MAX_LENGTH\s*=\s*)20/g,'$130');

    status=status
      .replace("const te=new TextEncoder(),td=new TextDecoder();","const te=new TextEncoder(),td=new TextDecoder('utf-8',{fatal:true});")
      .replace("function encField(f){const k=vi((f.n<<3)|f.w);if(f.w===0)return cat(k,vi(f.v));if(f.w===1||f.w===5)return cat(k,f.v);const body=f.v.fields?enc(f.v.fields):f.v.raw;return cat(k,vi(body.length),body)}","function dirtyField(f){if(!f||f.w!==2)return false;if(f.v?.raw?.length===0)return true;return Array.isArray(f.v?.fields)&&f.v.fields.some(dirtyField)}function encField(f){const k=vi((f.n<<3)|f.w);if(f.w===0)return cat(k,vi(f.v));if(f.w===1||f.w===5)return cat(k,f.v);const body=f.v.fields&&dirtyField(f)?enc(f.v.fields):f.v.raw;return cat(k,vi(body.length),body)}")
      .replace("const f0=(fs,n,w)=>fs.find(f=>f.n===n&&(w==null||f.w===w));","const f0=(fs,n,w)=>Array.isArray(fs)?fs.find(f=>f.n===n&&(w==null||f.w===w)):undefined;")
      .replace("const all=(fs,n,w)=>fs.filter(f=>f.n===n&&(w==null||f.w===w));","const all=(fs,n,w)=>Array.isArray(fs)?fs.filter(f=>f.n===n&&(w==null||f.w===w)):[];")
      .replace("function readPairs(dataField,formals){const byId=new Map();if(dataField?.v?.fields)for(const p of all(dataField.v.fields,501,2)){if(!p.v.fields)continue;const id=f0(p.v.fields,501,0),wrap=f0(p.v.fields,502,2);if(id&&wrap?.v.fields)byId.set(Number(id.v),wrap.v.fields)}return formals.map(v=>byId.has(v.id)?readValue(byId.get(v.id),v.typeEnum):defaultValue(v.typeEnum))}","function readPairs(dataField,formals){const byId=new Map();if(dataField?.v?.fields)for(const p of all(dataField.v.fields,501,2)){if(!p.v.fields)continue;const id=f0(p.v.fields,501,0),wrap=f0(p.v.fields,502,2);if(id&&wrap?.v.fields)byId.set(Number(id.v),wrap.v.fields)}return formals.map(v=>byId.has(v.id)?readValue(byId.get(v.id),v.typeEnum):defaultValue(v.typeEnum))}\nfunction readPairPresence(dataField,formals){const ids=new Set();if(dataField?.v?.fields)for(const p of all(dataField.v.fields,501,2)){if(!p.v.fields)continue;const id=f0(p.v.fields,501,0);if(id)ids.add(Number(id.v))}return formals.map(v=>ids.has(v.id))}")
      .replace("function replaceRepeated(fs,n,w,replacements){const idx=[];fs.forEach((f,i)=>{if(f.n===n&&f.w===w)idx.push(i)});if(idx.length){fs.splice(idx[0],idx.length,...replacements)}else{fs.unshift(...replacements)}}","function replaceRepeated(fs,n,w,replacements){if(!Array.isArray(fs))return;const first=fs.findIndex(f=>f.n===n&&f.w===w);const at=first<0?0:first;let before=0;for(let i=0;i<at;i++)if(!(fs[i].n===n&&fs[i].w===w))before++;const kept=fs.filter(f=>!(f.n===n&&f.w===w));kept.splice(before,0,...replacements);fs.splice(0,fs.length,...kept)}")
      .replace("function findFormalContainer(root){const candidates=[];walk(root,fs=>{const f34=f0(fs,34,2);if(!f34?.v.fields||!f0(fs,501,0)||!f0(fs,502,0)||!f0(fs,503,0)||!f0(fs,504,2))return;const defs=all(f34.v.fields,501,2).map(definitionInfo).filter(Boolean);candidates.push({field:f34,defs})});if(!candidates.length)return null;return candidates.sort((a,b)=>b.defs.length-a.defs.length)[0]}","function findFormalContainer(root){const candidates=[];walk(root,fs=>{if(!f0(fs,501,0)||!f0(fs,502,0)||!f0(fs,503,0)||!f0(fs,504,2))return;for(const field of fs){if(field.w!==2||!Array.isArray(field.v?.fields))continue;const defs=all(field.v.fields,501,2).map(definitionInfo).filter(Boolean);if(defs.length)candidates.push({field,defs})}});if(!candidates.length)return null;return candidates.sort((a,b)=>b.defs.length-a.defs.length)[0]}")
      .replace("function findModel(payload){const root=parse(payload);if(!root)return null;let best=null;walk(root,fs=>{const items=fs.map(itemInfo).filter(Boolean);if(items.length<2)return;if(!best||items.length>best.items.length)best={root,container:fs,items}});if(!best)return null;const fc=findFormalContainer(root);best.formalField=fc?.field||null;best.formals=(fc?.defs||[]).sort((a,b)=>a.id-b.id);best.items.forEach(item=>item.values=readPairs(item.dataField,best.formals));return best}","function findModel(payload){const root=parse(payload);if(!root)return null;let best=null;walk(root,fs=>{const items=all(fs,501,2).map(field=>itemInfo(field.v?.fields)).filter(Boolean);if(items.length<2)return;if(!best||items.length>best.items.length)best={root,container:fs,items}});if(!best)return null;const fc=findFormalContainer(root);best.formalField=fc?.field||null;best.formals=(fc?.defs||[]).sort((a,b)=>a.id-b.id);best.items.forEach(item=>{item.values=readPairs(item.dataField,best.formals);item.valuePresent=readPairPresence(item.dataField,best.formals)});return best}")
      .replace("const pairs=m.formals.map((v,i)=>buildPair(v,i+1,item.values[i]??defaultValue(v.typeEnum)));replaceRepeated(item.dataField.v.fields,501,2,pairs);","const pairs=m.formals.flatMap((v,i)=>item.valuePresent?.[i]?[buildPair(v,i+1,item.values[i]??defaultValue(v.typeEnum))]:[]);replaceRepeated(item.dataField.v.fields,501,2,pairs);")
      .replace("state.model.items.forEach(item=>item.values.splice(index,1));","state.model.items.forEach(item=>{item.values.splice(index,1);item.valuePresent?.splice(index,1)});")
      .replace("state.model.items.forEach(item=>[item.values[index],item.values[target]]=[item.values[target],item.values[index]]);","state.model.items.forEach(item=>{[item.values[index],item.values[target]]=[item.values[target],item.values[index]];if(item.valuePresent)[item.valuePresent[index],item.valuePresent[target]]=[item.valuePresent[target],item.valuePresent[index]]});")
      .replace("state.model.items.forEach(item=>item.values.push(0));","state.model.items.forEach(item=>{item.values.push(0);(item.valuePresent||(item.valuePresent=[])).push(false)});")
      .replace(".sd-value{display:grid;grid-template-columns:minmax(160px,.8fr) minmax(220px,1fr);",".sd-value{display:grid;grid-template-columns:minmax(160px,.8fr) auto minmax(220px,1fr);")
      .replace("row.innerHTML='<label></label><input>';row.querySelector('label').innerHTML=`${v.name} <span class=\"sd-pill\">${typeInfo(v.typeEnum).label}</span>`;const input=row.querySelector('input');","row.innerHTML='<label></label><label class=\"sd-use\"><input type=\"checkbox\"> Use</label><input>';row.querySelector('label').innerHTML=`${v.name} <span class=\"sd-pill\">${typeInfo(v.typeEnum).label}</span>`;const input=row.querySelector('input:not([type=\"checkbox\"])'),use=row.querySelector('input[type=\"checkbox\"]');use.checked=!!item.valuePresent?.[index];input.disabled=!use.checked;use.addEventListener('change',()=>{(item.valuePresent||(item.valuePresent=[]))[index]=use.checked;input.disabled=!use.checked;syncFormals()});")
      .replace("function buildFile(state){syncFormals();const payload=enc(state.model.root),header=new Uint8Array(state.bytes.slice(0,20)),view=new DataView(header.buffer);view.setUint32(0,20+payload.length,false);view.setUint32(16,payload.length,false);return cat(header,payload,state.bytes.slice(-4))}","function buildFile(state){syncFormals();const payload=enc(state.model.root),header=new Uint8Array(state.bytes.slice(0,20)),view=new DataView(header.buffer);view.setUint32(0,20+payload.length,false);view.setUint32(16,payload.length,false);const out=cat(header,payload,state.bytes.slice(-4));if(out.length-4!==view.getUint32(0,false)||out.length-24!==view.getUint32(16,false))throw Error('Export size validation failed');const check=statusFile(out);if(!check)throw Error('Export validation failed: generated GIA is not structurally valid');return out}")
      .replace(".sd-ref{display:grid;grid-template-columns:minmax(180px,1fr) 130px auto;",".sd-ref{display:grid;grid-template-columns:minmax(180px,1fr) auto;")
      .replace("row.innerHTML='<input><code></code><button class=\"danger\">Remove</button>';const input=row.querySelector('input'),code=row.querySelector('code');input.value=hex(id);code.textContent=String(id);input.addEventListener('change',()=>{const n=parseId(input.value);if(n===null){input.value=hex(item.refs[index]);return}const next=[...item.refs];next[index]=n;setRefs(item,next);input.value=hex(n);code.textContent=String(n)});","row.innerHTML='<input inputmode=\"numeric\"><button class=\"danger\">Remove</button>';const input=row.querySelector('input');input.value=String(id);input.addEventListener('change',()=>{const n=parseId(input.value);if(n===null){input.value=String(item.refs[index]);return}const next=[...item.refs];next[index]=n;setRefs(item,next);input.value=String(n)});")
      .replace(/maxlength=\"20\"/g,'maxlength="30"')
      .replace("v.name=input.value.slice(0,20);","v.name=input.value.slice(0,30);")
      .replace("name:`Variable ${i+1}`.slice(0,20)","name:`Variable ${i+1}`.slice(0,30)");

    source=source.replace('</style>','\n'+css+'\n</style>');
    const scripts=js+'\n'+status+'\n'+deck;
    source=source.replace('</body>','<script>'+scripts.replace(/<\/script/gi,'<\\/script')+'<\/script></body>');

    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>document.getElementById('boot')?.remove(),{once:true});
    frame.srcdoc=source;
  }catch(error){
    console.error(error);
    document.getElementById('boot').innerHTML='<div><strong>Editor failed to load.</strong><br>Refresh the page to try again.</div>';
  }
})();
</script>
</body>
</html>
