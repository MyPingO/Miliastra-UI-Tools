<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Fast, local-only editor and builder for Miliastra UI component GIA and variable export files.">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<title>Miliastra UI Tools · Data Editor</title>
<style>
html,body,#app{width:100%;height:100%;margin:0;background:#090d16}
#app{border:0;display:block}
.boot{position:fixed;inset:0;display:grid;place-items:center;color:#93a4bb;font:14px system-ui;background:#090d16}
.boot strong{color:#f4f7fb}
</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>Miliastra UI Tools</strong><br>Loading editor…</div></div>
<iframe id="app" title="Miliastra UI Tools editor"></iframe>
<script>
(async()=>{
  try{
    const opts={cache:'no-store'};
    const version='20260906l';
    const sourceRes=await fetch('./assets/editor-core.html?v='+version,opts);
    const cssRes=await fetch('./assets/site.css?v='+version,opts);
    const siteRes=await fetch('./assets/site.js?v='+version,opts);
    const statusRes=await fetch('./assets/status-display.js?v='+version,opts);
    const tabsRes=await fetch('./assets/component-tabs.js?v='+version,opts);
    const dictionaryKeyTypesRes=await fetch('./assets/dictionary-key-types.js?v='+version,opts);
    const dictionaryStructureConfigRes=await fetch('./assets/dictionary-structure-config.js?v='+version,opts);
    const structureGiaReferencesRes=await fetch('./assets/structure-gia-references.js?v='+version,opts);
    const dataShapeSafetyRes=await fetch('./assets/data-shape-safety.js?v='+version,opts);
    const valueEditorsRes=await fetch('./assets/value-editors.js?v='+version,opts);
    if(!sourceRes.ok)throw new Error('Failed to load editor-core.html');
    if(!cssRes.ok)throw new Error('Failed to load site.css');
    if(!siteRes.ok)throw new Error('Failed to load site.js');
    if(!statusRes.ok)throw new Error('Failed to load status-display.js');
    if(!tabsRes.ok)throw new Error('Failed to load component-tabs.js');
    if(!dictionaryKeyTypesRes.ok)throw new Error('Failed to load dictionary-key-types.js');
    if(!dictionaryStructureConfigRes.ok)throw new Error('Failed to load dictionary-structure-config.js');
    if(!structureGiaReferencesRes.ok)throw new Error('Failed to load structure-gia-references.js');
    if(!dataShapeSafetyRes.ok)throw new Error('Failed to load data-shape-safety.js');
    if(!valueEditorsRes.ok)throw new Error('Failed to load value-editors.js');

    let source=await sourceRes.text();
    const css=await cssRes.text();
    const scripts=[
      await siteRes.text(),
      await statusRes.text(),
      await tabsRes.text(),
      await dictionaryKeyTypesRes.text(),
      await dictionaryStructureConfigRes.text(),
      await structureGiaReferencesRes.text(),
      await dataShapeSafetyRes.text(),
      await valueEditorsRes.text()
    ].join('\n');

    source=source.replace('</style>','\n'+css+'\n</style>');
    source=source.replace('</body>','<script>'+scripts.replace(/<\/script/gi,'<\\/script')+'<\/script></body>');

    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>document.getElementById('boot')?.remove(),{once:true});
    frame.srcdoc=source;
  }catch(error){
    console.error(error);
    document.getElementById('boot').innerHTML='<div><strong>Editor failed to load.</strong><br>'+String(error.message||error)+'</div>';
  }
})();
</script>
</body>
</html>
